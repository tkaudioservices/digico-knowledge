<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="642px" height="315px" viewBox="0 0 642 315"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="10" y="10" width="600" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#BE1E2D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"><text x="12" y="25">HOW SNAPSHOTS ARE STORED: section d2</text></g></g></g><g data-cell-id="pool"><g transform="translate(0.5,0.5)"><rect x="10" y="40" width="300" height="40" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="18" y="59">Component pool</text><text x="18" y="72">11,780 records in the sample; one layout; each stored once</text></g></g></g><g data-cell-id="p0"><g transform="translate(0.5,0.5)"><rect x="10" y="92" width="300" height="24" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="18" y="109.5">Vox 1 · output</text></g></g></g><g data-cell-id="p1"><g transform="translate(0.5,0.5)"><rect x="10" y="122" width="300" height="24" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="18" y="139.5">Vox 1 · EQ</text></g></g></g><g data-cell-id="p2"><g transform="translate(0.5,0.5)"><rect x="10" y="152" width="300" height="24" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="18" y="169.5">Kick · output</text></g></g></g><g data-cell-id="p3"><g transform="translate(0.5,0.5)"><rect x="10" y="182" width="300" height="24" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="18" y="199.5">Kick · output, later</text></g></g></g><g data-cell-id="tbl1"><g transform="translate(0.5,0.5)"><rect x="390" y="40" width="230" height="68" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="398" y="59">Snapshot 1 table</text><text x="398" y="72">object → pool indices</text><text x="398" y="85">Vox 1 → [0, 1, …]</text><text x="398" y="98">Kick → [2, …]</text></g></g></g><g data-cell-id="tbl2"><g transform="translate(0.5,0.5)"><rect x="390" y="124" width="230" height="54" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="398" y="143">Snapshot 2 table</text><text x="398" y="156">Vox 1 → [0, 1, …]  unchanged, shared</text><text x="398" y="169">Kick → [3, …]  changed, new entry</text></g></g></g><g data-cell-id="tr"><g transform="translate(0.5,0.5)"><rect x="390" y="194" width="230" height="54" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="398" y="213">Trailer after each table</text><text x="398" y="226">u16-length name · f64 time · u16 0x03E0</text><text x="398" y="239">~1.9 KB scope mask</text></g></g></g><g data-cell-id="a"><g transform="translate(0.5,0.5)"><path d="M 390 74 L 350 74 L 350 104 L 318.12 104" fill="none" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/><path d="M 311.12 104 L 318.12 101.67 L 318.12 106.33 Z" fill="#be1e2d" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164)); stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/></g></g><g data-cell-id="b"><g transform="translate(0.5,0.5)"><path d="M 390 74 L 160 74 L 160 143.88" fill="none" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/><path d="M 160 150.88 L 157.67 143.88 L 162.33 143.88 Z" fill="#be1e2d" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164)); stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><path d="M 390 151 L 350 151 L 350 134 L 318.12 134" fill="none" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/><path d="M 311.12 134 L 318.12 131.67 L 318.12 136.33 Z" fill="#be1e2d" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164)); stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/></g></g><g data-cell-id="d2"><g transform="translate(0.5,0.5)"><path d="M 390 151 L 160 151 L 160 173.88" fill="none" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/><path d="M 160 180.88 L 157.67 173.88 L 162.33 173.88 Z" fill="#be1e2d" stroke="#be1e2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164)); stroke: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"/></g></g><g data-cell-id="why"><g><rect x="10" y="222" width="340" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="12" y="239">A channel block that is identical across twenty</text><text x="12" y="252">snapshots is stored once. That is why 45</text><text x="12" y="265">snapshots fit in 11.75 MB instead of 60 MB, and</text><text x="12" y="278">why renaming a channel on the desk does not</text><text x="12" y="291">rewrite old snapshots.</text></g></g></g></g></g></g></svg>