<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="672px" height="430px" viewBox="0 0 672 430"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="10" y="10" width="640" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#BE1E2D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: light-dark(rgb(190, 30, 45), rgb(255, 151, 164));"><text x="12" y="25">ONE COMPONENT RECORD: every processing block, everywhere in the file</text></g></g></g><g data-cell-id="f0"><g transform="translate(0.5,0.5)"><rect x="10" y="40" width="50" height="23" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="57">+0</text></g></g></g><g data-cell-id="g0"><g transform="translate(0.5,0.5)"><rect x="60" y="40" width="130" height="23" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="57">da 00 3a 00</text></g></g></g><g data-cell-id="d0"><g><rect x="200" y="42" width="440" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="59">marker; 0x3a = 58 = length of the fixed part that follows</text></g></g></g><g data-cell-id="f1"><g transform="translate(0.5,0.5)"><rect x="10" y="69" width="50" height="68" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="108.5">+4</text></g></g></g><g data-cell-id="g1"><g transform="translate(0.5,0.5)"><rect x="60" y="69" width="130" height="68" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="108.5">u32 type</text></g></g></g><g data-cell-id="d1"><g><rect x="200" y="71" width="440" height="68" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="88">1 input stage · 2 aux sends · 3 group routing · 4 EQ · 5</text><text x="202" y="101">multiband · 7 HPF/LPF · 8 dynamics · 12 output (fader, mute)</text><text x="202" y="114">· 14 output patch · 15 graphic EQ · 16 control group · 17/18</text><text x="202" y="127">socket · 21 FX</text></g></g></g><g data-cell-id="f2"><g transform="translate(0.5,0.5)"><rect x="10" y="143" width="50" height="38" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="167.5">+8</text></g></g></g><g data-cell-id="g2"><g transform="translate(0.5,0.5)"><rect x="60" y="143" width="130" height="38" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="167.5">name[32]</text></g></g></g><g data-cell-id="d2"><g><rect x="200" y="145" width="440" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="162">length byte + up to 31 chars; bytes past the length are</text><text x="202" y="175">leftovers from before</text></g></g></g><g data-cell-id="f3"><g transform="translate(0.5,0.5)"><rect x="10" y="187" width="50" height="23" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="204">+40</text></g></g></g><g data-cell-id="g3"><g transform="translate(0.5,0.5)"><rect x="60" y="187" width="130" height="23" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="204">f64 TDateTime</text></g></g></g><g data-cell-id="d3"><g><rect x="200" y="189" width="440" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="206">last change; days since 30 December 1899</text></g></g></g><g data-cell-id="f4"><g transform="translate(0.5,0.5)"><rect x="10" y="216" width="50" height="23" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="233">+48</text></g></g></g><g data-cell-id="g4"><g transform="translate(0.5,0.5)"><rect x="60" y="216" width="130" height="23" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="233">u32 n</text></g></g></g><g data-cell-id="d4"><g><rect x="200" y="218" width="440" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="235">number of parameter records</text></g></g></g><g data-cell-id="f5"><g transform="translate(0.5,0.5)"><rect x="10" y="245" width="50" height="23" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="262">+52</text></g></g></g><g data-cell-id="g5"><g transform="translate(0.5,0.5)"><rect x="60" y="245" width="130" height="23" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="262">u8 u32 u8 u32</text></g></g></g><g data-cell-id="d5"><g><rect x="200" y="247" width="440" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="264">flags; the u8 at +57 is 1 in the live state and 0 elsewhere</text></g></g></g><g data-cell-id="f6"><g transform="translate(0.5,0.5)"><rect x="10" y="274" width="50" height="38" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="298.5">+62</text></g></g></g><g data-cell-id="g6"><g transform="translate(0.5,0.5)"><rect x="60" y="274" width="130" height="38" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="298.5">n × 8 bytes</text></g></g></g><g data-cell-id="d6"><g><rect x="200" y="276" width="440" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="293">id · type · index · flag · 4-byte value (f32 or packed</text><text x="202" y="306">bytes)</text></g></g></g><g data-cell-id="f7"><g transform="translate(0.5,0.5)"><rect x="10" y="318" width="50" height="23" fill="#f1efe8" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(241, 239, 232), rgb(34, 32, 26)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="38" y="335">end</text></g></g></g><g data-cell-id="g7"><g transform="translate(0.5,0.5)"><rect x="60" y="318" width="130" height="23" fill="#ffffff" stroke="#1b1916" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"/></g><g><g fill="#1B1916" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="68" y="335">i32 i32 u32</text></g></g></g><g data-cell-id="d7"><g><rect x="200" y="320" width="440" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5D574E" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(93, 87, 78), rgb(166, 161, 153));"><text x="202" y="337">two references (−1 when unused) and a zero word</text></g></g></g><g data-cell-id="p"><g><rect x="10" y="357" width="640" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1B1916" font-family="'Courier New'" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(27, 25, 22), rgb(217, 215, 213));"><text x="12" y="373">a parameter record, bytes as stored:</text><text x="12" y="385">00 01 00 00 | 00 00 04 23</text><text x="12" y="397">id 0x00  type 1  index 0  flag 0 | value: socket 4 on port group 0x23 = the input patch</text></g></g></g></g></g></g></svg>